[pytest]
# Let the tests import `app.probe`. Without this, pytest only puts the tests/
# folder on the import path, and `from app.probe import ...` fails.
pythonpath = .
testpaths = tests

# The probe is async now, so tests must be too. "auto" means pytest-asyncio
# runs any `async def test_...` for us, without a decorator on each one.
asyncio_mode = auto
