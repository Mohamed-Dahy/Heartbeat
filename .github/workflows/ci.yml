# Continuous Integration.
#
# Every push to main, and every pull request, GitHub gives us a clean computer
# that checks out this repo and proves the tests still pass. Nothing is
# installed on it beforehand, so it cannot accidentally rely on something that
# only exists on one developer's machine.
#
# This file lives in .github/workflows/ — GitHub finds it by that path alone.

name: CI

# Docker registries reject capital letters in image names, and this repo has
# them in both halves: Mohamed-Dahy/Heartbeat.
#
# metadata-action lowercases the names it produces, but anywhere we write the
# name ourselves — a raw `outputs:` field, a shell command — we get no such
# protection. So it is spelled out once here, lowercase, and used everywhere.
env:
  IMAGE_NAME: ghcr.io/mohamed-dahy/heartbeat

# --- When to run -----------------------------------------------------------
on:
  push:
    branches: [main]
  # Every pull request too, so problems are visible before merging rather than
  # after. Deliberately not "every branch": that spends time telling you about
  # work you already know is half finished.
  pull_request:

jobs:
  test:
    name: Tests
    # Pinned to a specific Ubuntu, not "ubuntu-latest". Latest silently moves
    # under you, and one morning the build breaks with no commit to blame.
    runs-on: ubuntu-24.04

    steps:
      # The runner starts completely empty — it does not even have our code.
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Install Python 3.12
        uses: actions/setup-python@v7
        with:
          # Same version as the Dockerfile and local development, so all three
          # agree.
          python-version: "3.12"
          # Keep the downloaded packages between runs. Without this every run
          # re-downloads FastAPI and friends from scratch.
          cache: pip
          # Tell the cache which file decides when it is stale. Left unset it
          # looks for requirements.txt, but our test tools are in the dev file.
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # The tests never touch the network: respx intercepts every outgoing
      # request, and fails loudly on any we did not mock. So this cannot go red
      # just because a provider was having a bad afternoon.
      - name: Run the tests
        run: pytest -v

  # A separate job, so it runs at the same time as the tests rather than after.
  # You want to hear about a lint problem AND a test failure in the same three
  # minutes, not one and then the other.
  lint-python:
    name: Lint (Python)
    runs-on: ubuntu-24.04

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Install Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Finds real problems: unused imports, undefined names, likely bugs.
      - name: Lint
        run: ruff check .

      # --check means "tell me if the formatting is wrong", not "fix it".
      # CI must never quietly rewrite your code; it reports, you decide.
      - name: Check formatting
        run: ruff format --check .

  lint-frontend:
    name: Lint (frontend)
    runs-on: ubuntu-24.04

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Install Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci installs exactly what package-lock.json says and fails if the
      # lockfile disagrees with package.json. Repeatable, unlike npm install.
      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      # The type checker is a stricter net than the linter: it proves the data
      # we get back from our own API matches the shape the page expects.
      - name: Type-check
        working-directory: frontend
        run: npx tsc -b

  # Proves the image builds on a machine that has never seen this project.
  #
  # This catches something nothing else can. Every local `docker build` has run
  # with frontend/node_modules and frontend/dist already sitting on disk. Here
  # neither exists — the runner has only what is committed to git. If the build
  # quietly leaned on anything untracked, it fails here.
  #
  # Deliberately does NOT wait for the tests. Separate job, so both run at once
  # and you learn about a broken Dockerfile and a broken test together.
  #
  # Pull requests only: on main, the publish job below does the building.
  # Otherwise every push to main would build the same image twice.
  build:
    name: Docker build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      # Buildx is Docker's newer builder. We need it for the layer cache below,
      # and later for building two architectures at once.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          # Build only. Publishing comes in the next step, once we trust it.
          push: false
          # Store the layers in GitHub's cache and reuse them next run. Without
          # this, every run reinstalls React and FastAPI from scratch. Same idea
          # as copying requirements.txt before the app code in the Dockerfile,
          # one level up.
          cache-from: type=gha
          # ignore-error=true matters. GitHub's cache service is occasionally
          # flaky and fails while *writing* the cache — after the image has
          # already built perfectly. Without this the whole job goes red over a
          # failed optimisation.
          #
          # The rule: never let a speed-up break the thing it was speeding up.
          # A missing cache costs a slower build. A red pipeline costs trust.
          cache-to: type=gha,mode=max,ignore-error=true

  # Publishes the image to GitHub Container Registry (GHCR).
  #
  # A registry is GitHub, but for finished programs instead of source code. In
  # Phase 9 the server will download from here and run it, rather than building
  # anything itself — servers should run software, not compile it.
  #
  # This runs twice at once, on two real machines: one Intel, one ARM.
  #
  # A processor architecture is the vocabulary a chip speaks. x86 (your laptop)
  # and ARM (phones, Apple Silicon, and Oracle's free tier) speak different ones,
  # and compiled code for one is gibberish to the other. So the image has to be
  # built twice.
  #
  # We use genuine ARM hardware rather than pretending to be ARM in software.
  # Emulation works but `npm ci` and `pip install` crawl under it — 15-25 minutes
  # instead of 3-5.
  publish:
    name: Publish ${{ matrix.platform }}
    # Only on a real push to main. A pull request must never be able to publish:
    # anyone can open one, and publishing is how code reaches production.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # And only once the tests and linters have passed. The build job above runs
    # without waiting, because fast feedback is worth more than order. Here the
    # opposite is true: never publish something we have not proven works.
    needs: [test, lint-python, lint-frontend]
    runs-on: ${{ matrix.runner }}

    strategy:
      # Do not cancel the ARM build just because the Intel one failed. We want
      # to see both results, not the first failure.
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    # The token GitHub gives each run can only READ by default. Publishing needs
    # permission to write packages, and we ask for exactly that and nothing more.
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # No secret of ours is involved. GitHub mints a temporary token for this
      # run and destroys it when the run ends, so there is nothing to leak,
      # rotate, or accidentally commit.
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only the image NAME here, no tags. Neither of these two jobs may tag
      # anything: whichever finished second would overwrite the first, and one
      # architecture would silently vanish.
      #
      # It also lowercases the name for us, which matters here: this repo is
      # "Mohamed-Dahy/Heartbeat" and Docker registries reject capital letters.
      - name: Work out the image name
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}

      # Pushes an untagged image, identified only by its digest — a hash of its
      # contents. Anonymous but permanent. The merge job below collects both
      # digests and gives them a shared name.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          # Separate cache per architecture. ARM layers are useless to the Intel
          # build, and sharing one cache would make them fight over it.
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }},ignore-error=true

      # Write the digest to a file so it can be handed to the merge job.
      # Jobs run on different machines and share nothing, so anything one job
      # needs from another has to be passed explicitly.
      - name: Save the digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${digest#sha256:}"
        env:
          digest: ${{ steps.build.outputs.digest }}

      - name: Upload the digest
        uses: actions/upload-artifact@v7
        with:
          # "linux/amd64" contains a slash, which is not allowed in a file name.
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          retention-days: 1

  # Takes the two anonymous images and publishes one tag that covers both.
  #
  # The result is a "manifest list": a signpost stored under a single tag saying
  # "if you are ARM take this one, if you are Intel take that one". Anyone
  # pulling ghcr.io/mohamed-dahy/heartbeat:latest silently gets the right one and
  # never has to know there were two.
  merge:
    name: Combine into one tag
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write

    steps:
      - name: Download the digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Now the tags, once, in the only place it is safe to apply them.
      - name: Work out the tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      # Builds the signpost. jq turns the tag list into repeated -t flags, and
      # each filename in /tmp/digests is one of the two images we pushed.
      - name: Create the combined tag
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Show what was published
        run: docker buildx imagetools inspect ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
