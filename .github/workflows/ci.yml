# Continuous Integration.
#
# Every push to main, and every pull request, GitHub gives us a clean computer
# that checks out this repo and proves the tests still pass. Nothing is
# installed on it beforehand, so it cannot accidentally rely on something that
# only exists on one developer's machine.
#
# This file lives in .github/workflows/ — GitHub finds it by that path alone.

name: CI

# --- When to run -----------------------------------------------------------
on:
  push:
    branches: [main]
  # Every pull request too, so problems are visible before merging rather than
  # after. Deliberately not "every branch": that spends time telling you about
  # work you already know is half finished.
  pull_request:

jobs:
  test:
    name: Tests
    # Pinned to a specific Ubuntu, not "ubuntu-latest". Latest silently moves
    # under you, and one morning the build breaks with no commit to blame.
    runs-on: ubuntu-24.04

    steps:
      # The runner starts completely empty — it does not even have our code.
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Install Python 3.12
        uses: actions/setup-python@v7
        with:
          # Same version as the Dockerfile and local development, so all three
          # agree.
          python-version: "3.12"
          # Keep the downloaded packages between runs. Without this every run
          # re-downloads FastAPI and friends from scratch.
          cache: pip
          # Tell the cache which file decides when it is stale. Left unset it
          # looks for requirements.txt, but our test tools are in the dev file.
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # The tests never touch the network: respx intercepts every outgoing
      # request, and fails loudly on any we did not mock. So this cannot go red
      # just because a provider was having a bad afternoon.
      - name: Run the tests
        run: pytest -v

  # A separate job, so it runs at the same time as the tests rather than after.
  # You want to hear about a lint problem AND a test failure in the same three
  # minutes, not one and then the other.
  lint-python:
    name: Lint (Python)
    runs-on: ubuntu-24.04

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Install Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Finds real problems: unused imports, undefined names, likely bugs.
      - name: Lint
        run: ruff check .

      # --check means "tell me if the formatting is wrong", not "fix it".
      # CI must never quietly rewrite your code; it reports, you decide.
      - name: Check formatting
        run: ruff format --check .

  lint-frontend:
    name: Lint (frontend)
    runs-on: ubuntu-24.04

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Install Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci installs exactly what package-lock.json says and fails if the
      # lockfile disagrees with package.json. Repeatable, unlike npm install.
      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      # The type checker is a stricter net than the linter: it proves the data
      # we get back from our own API matches the shape the page expects.
      - name: Type-check
        working-directory: frontend
        run: npx tsc -b

  # Proves the image builds on a machine that has never seen this project.
  #
  # This catches something nothing else can. Every local `docker build` has run
  # with frontend/node_modules and frontend/dist already sitting on disk. Here
  # neither exists — the runner has only what is committed to git. If the build
  # quietly leaned on anything untracked, it fails here.
  #
  # Deliberately does NOT wait for the tests. Separate job, so both run at once
  # and you learn about a broken Dockerfile and a broken test together.
  build:
    name: Docker build
    runs-on: ubuntu-24.04

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      # Buildx is Docker's newer builder. We need it for the layer cache below,
      # and later for building two architectures at once.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          # Build only. Publishing comes in the next step, once we trust it.
          push: false
          # Store the layers in GitHub's cache and reuse them next run. Without
          # this, every run reinstalls React and FastAPI from scratch. Same idea
          # as copying requirements.txt before the app code in the Dockerfile,
          # one level up.
          cache-from: type=gha
          cache-to: type=gha,mode=max
